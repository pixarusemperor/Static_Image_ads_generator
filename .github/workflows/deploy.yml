# =============================================================================
# Coolify Deploy — Static_Image_ads_generator
#
# Official Coolify GitHub Actions flow:
#   1. build-and-push.yml builds + pushes image to ghcr.io
#   2. This workflow fires the per-app Deploy Webhook URL (GET with
#      Authorization: Bearer $COOLIFY_TOKEN)
#   3. Coolify pulls the new image and restarts the container
#
# Per https://coolify.io/docs/applications/ci-cd/github/actions
#
# Required repo secrets (set via `gh secret set`):
#   COOLIFY_WEBHOOK  — the per-app Deploy Webhook URL from Coolify's Webhook tab
#                      (e.g. https://coolifyone.orizongroup.online/webhooks/deploy/<uuid>?tag=latest)
#   COOLIFY_TOKEN    — Coolify API token (the same one from .env)
# =============================================================================

name: Deploy to Coolify

on:
  workflow_run:
    workflows: ["Build & Push Image"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

# Only one deploy at a time per branch; new pushes cancel the old one.
concurrency:
  group: coolify-deploy-static-image-ads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Only deploy if the build succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Coolify deploy via webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN:   ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${COOLIFY_WEBHOOK}" ] || [ -z "${COOLIFY_TOKEN}" ]; then
            echo "::error::COOLIFY_WEBHOOK or COOLIFY_TOKEN is missing — set them via 'gh secret set'"
            exit 1
          fi
          echo "==> Triggering deploy via webhook"
          RESPONSE=$(curl -sk -S --fail-with-body \
            -X GET \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK}")
          echo "${RESPONSE}" | jq . || echo "${RESPONSE}"
          echo "==> Deploy triggered. Coolify will pull the new image from ghcr.io."
