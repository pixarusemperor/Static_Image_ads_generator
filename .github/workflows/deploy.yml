# =============================================================================
# Coolify Deploy — Static_Image_ads_generator
#
# Triggers on push to master. Triggers an instant deploy via the proven
# POST /api/v1/deploy endpoint, then polls until the deployment reaches
# 'finished' or 'failed' (or 10-minute timeout).
#
# Required repo secrets (set via `gh secret set`):
#   COOLIFY_API_TOKEN — Coolify API token (deploy scope)
#   COOLIFY_APP_UUID  — itg0ipriumh9bqd11p3lr8ro (the static-image-ads-generator app)
#   COOLIFY_BASE_URL  — https://coolifyone.orizongroup.online
#
# Reference: https://github.com/pixarusemperor/coolify-deploy-playbook
# =============================================================================

name: Deploy to Coolify

on:
  push:
    branches:
      - master
  workflow_dispatch:

# Only one deploy at a time per branch; new pushes cancel the old one.
concurrency:
  group: coolify-deploy-static-image-ads-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 5-min buffer above the 10-min poll loop

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID:     ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_URL:  ${{ secrets.COOLIFY_BASE_URL }}
        run: |
          set -euo pipefail
          echo "==> Triggering deploy for app ${APP_UUID} via ${COOLIFY_URL}"

          RESPONSE=$(curl -sk -S --fail-with-body \
            -X POST \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${APP_UUID}\"}" \
            "${COOLIFY_URL}/api/v1/deploy")

          echo "${RESPONSE}" | jq .

          DEPLOY_UUID=$(echo "${RESPONSE}" | jq -r '.deployments[0].deployment_uuid // .deployments[0].uuid // .deployment_uuid // empty')
          if [ -z "${DEPLOY_UUID}" ]; then
            echo "::error::No deployment UUID returned — is the token scoped to deploy?"
            exit 1
          fi
          echo "==> Deployment UUID: ${DEPLOY_UUID}"
        id: trigger

      - name: Wait for deployment
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          APP_UUID:     ${{ secrets.COOLIFY_APP_UUID }}
          COOLIFY_URL:  ${{ secrets.COOLIFY_BASE_URL }}
        run: |
          set -euo pipefail
          MAX_ATTEMPTS=40          # 40 × 15s = 10 minutes
          INTERVAL=15

          echo "==> Polling deployment status for app ${APP_UUID}"

          for i in $(seq 1 ${MAX_ATTEMPTS}); do
            echo ""
            echo "--- Attempt ${i}/${MAX_ATTEMPTS} at $(date -u +%H:%M:%S) UTC ---"

            RESPONSE=$(curl -sk -S \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              "${COOLIFY_URL}/api/v1/deployments/applications/${APP_UUID}")

            STATUS=$(echo "${RESPONSE}" | jq -r '.deployments[0].status // "unknown"')
            echo "Current status: ${STATUS}"

            case "${STATUS}" in
              finished)
                echo ""
                echo "=============================================="
                echo "✓ DEPLOY SUCCEEDED"
                echo "=============================================="
                exit 0
                ;;
              failed)
                echo ""
                echo "=============================================="
                echo "✗ DEPLOY FAILED"
                echo "=============================================="
                echo "${RESPONSE}" | jq .
                exit 1
                ;;
              queued|building|deploying|*)
                sleep ${INTERVAL}
                ;;
            esac
          done

          echo ""
          echo "=============================================="
          echo "✗ TIMEOUT — deployment did not finish in 10 minutes"
          echo "=============================================="
          exit 1
